<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login - RealSoft RAG</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 320px; }
        h2 { margin-top: 0; color: #007acc; }
        label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
        .error { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>RealSoft RAG Login</h2>
        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="username" required autofocus autocomplete="username" />
            <label>Password</label>
            <input type="password" id="password" required autocomplete="current-password" />
            <button type="submit">Log In</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";
            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("role", data.role);
                    window.location.href = "/";
                    return;
                }
                errorMsg.textContent = data.detail || "Login failed.";
            } catch (err) {
                errorMsg.textContent = "Could not reach the server.";
            }
            errorMsg.style.display = "block";
        });
    </script>
</body>
</html>
